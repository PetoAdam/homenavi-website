server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve the Next.js static export; fall back to the 404 page with a real 404 status.
  location / {
    try_files $uri $uri.html $uri/ @404;
  }

  location @404 {
    return 404 /404.html;
  }

  # Long-lived cache for screenshots and other static assets.
  location /screenshots/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
}
